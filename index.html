/* --------------------------------- 侧栏 --------------------------------- */
function renderCats() {
  const box = document.getElementById('cats');
  box.innerHTML = '';
  for (const c of CATS) {
    const n = COMPS.filter(x => catOf(x) === c.id).length;
    const b = document.createElement('button');
    b.className = (cat === c.id ? 'on' : '');
    b.innerHTML = c.label + '<span class="n">' + n + '</span>';
    b.disabled = n === 0;
    b.onclick = () => {
      cat = c.id; active = null; marks = {};
      groups = buildGroups(cat);
      renderCats(); renderList();
      /* 抽屉收成一条时切了分类也看不见列表，顺手拉开 */
      if (isMobileLayout() && drawerState === 'mini') setDrawer('half');
      drawBase();
    };
    box.appendChild(b);
  }
  /* 分类条高度定了，抽屉的「只露分类」那一档才算得准 */
  fitDrawer();
}

/* 选中一个分组（侧栏点击、键盘上下、URL 书签都走这里） */
function selectGroup(grp, idx) {
  active = grp;
  loadMarks(grp);
  renderList();
  drawBase();
  try { history.replaceState(null, '', '#g=' + encodeURIComponent(grp.v)); } catch (_) { }
  if (idx != null) {
    const rows = document.querySelectorAll('#list .grp');
    if (rows[idx]) rows[idx].scrollIntoView({ block: 'nearest' });
  }
}

function renderList() {
  const box = document.getElementById('list');
  box.innerHTML = '';
  if (!groups.length) {
    box.innerHTML = '<div id="empty">这一类没有元件<br>（位号规则：R / C / L / D / Q / LED / Y…）</div>';
    return;
  }
  for (const grp of groups) {
    const done = peekMarked(grp);
    const pol = polarOfGroup(grp);
    const b = document.createElement('button');
    b.className = 'grp' + (active && active.key === grp.key ? ' on' : '') +
      (done === grp.items.length ? ' done' : '');
    b.innerHTML =
      '<div class="l1">' +
      '<span class="nm">' + fmtVal(grp, cat) + '</span>' +
      (pol ? '<span class="pl' + (pol.all ? '' : ' part') + '" title="' +
        pol.kind + '，有方向，焊前确认">' + (pol.all ? '极性' : '部分极性') + '</span>' : '') +
      '<span class="fp">' + grp.fp + '</span>' +
      '<span class="ct">' + done + '/' + grp.items.length + '</span>' +
      '</div>' +
      '<div class="bar"><i style="width:' + Math.round(done / grp.items.length * 100) + '%"></i></div>';
    b.onclick = () => {
      selectGroup(grp);
      /* 手机上选完立刻把抽屉收成一条：接下去是低头焊板，屏幕要让给板图 */
      if (isMobileLayout()) setDrawer('mini');
    };
    box.appendChild(b);

    // 选中组下方展开序号 chips：点一下图上就打十字准星，不用靠眼色找
    if (active && active.key === grp.key) {
      const ordered = orderItems(grp.items);
      const wrap = document.createElement('div');
      wrap.className = 'chips';
      ordered.forEach((c, i) => {
        const chip = document.createElement('button');
        chip.className = 'chip' + (marks[c.d] ? ' m' : '');
        chip.innerHTML = '<b>' + (i + 1) + '</b><span>' + c.d + '</span>' +
          (polarOf(c) ? '<i class="pd">▲</i>' : '');
        chip.onclick = ev => {
          ev.stopPropagation();
          focusItem(i);
          const d = c.d;
          if (marks[d]) delete marks[d]; else marks[d] = true;
          saveMarks(active);
          renderList();
          drawBase();
        };
        wrap.appendChild(chip);
      });
      box.appendChild(wrap);
    }
  }
}

/* -------------------------------- 命中测试 ------------------------------- */
const TOUCH = matchMedia('(pointer: coarse)').matches;   // 粗指针 ≈ 手指
let suppressClick = false;   // 刚做完缩放/拖动，紧接着的 click 不算数

stage.addEventListener('click', ev => {
  if (suppressClick) { suppressClick = false; return; }
  if (ev.target.closest && ev.target.closest('#zoom')) return;   // 点的是缩放按钮
  if (!active || !layout) return;
  const p = stagePoint(ev.clientX, ev.clientY);
  const x = p.x, y = p.y;
  /* 手指有面积，容差给大一点；按「离哪个最近」选，不是按命中顺序，
     否则整板视图下元件挤在一起时会选错一颗 */
  const tol = TOUCH ? 13 : 4;
  let hit = null, bestD = Infinity;
  for (const r of layout.hits) {
    const dx = Math.max(r.x - x, 0, x - (r.x + r.w));
    const dy = Math.max(r.y - y, 0, y - (r.y + r.h));
    const d = Math.hypot(dx, dy);
    if (d <= tol && d < bestD) { bestD = d; hit = r; }
  }
  if (!hit) return;
  const d = hit.c.d;
  if (marks[d]) delete marks[d]; else marks[d] = true;
  saveMarks(active);
  renderList();
  drawBase();
});

/* ---------------------------- 双指缩放 / 单指拖动 ---------------------------- *
 * 全部走 Pointer Events：鼠标、触屏、触控笔一套代码。
 * 单指拖动只在已放大时平移（k=1 时整板都在视野里，没有可移动的）。 */
const ptrs = new Map();
let panFrom = null, pinch = null, moved = 0, drawRaf = 0;

function scheduleDraw() {
  if (drawRaf) return;
  drawRaf = requestAnimationFrame(() => { drawRaf = 0; drawBase(); });
}

stage.addEventListener('pointerdown', ev => {
  if (!COMPS.length) return;
  if (ev.target.closest && ev.target.closest('#zoom')) return;   // 别把按钮的点击当成拖图
  ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  try { stage.setPointerCapture(ev.pointerId); } catch (_) { }
  if (ptrs.size === 1) {
    panFrom = { x: ev.clientX, y: ev.clientY };
    moved = 0;
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const mid = stagePoint((a.x + b.x) / 2, (a.y + b.y) / 2);
    pinch = {
      d: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)),
      k: VIEW.k,
      lx: mid.x,
      ly: mid.y,
    };
    panFrom = null;
  }
});

stage.addEventListener('pointermove', ev => {
  if (!ptrs.has(ev.pointerId)) return;
  const p = ptrs.get(ev.pointerId);
  moved += Math.hypot(ev.clientX - p.x, ev.clientY - p.y);
  ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });

  if (ptrs.size >= 2 && pinch) {
    const [a, b] = [...ptrs.values()];
    const mid = stagePoint((a.x + b.x) / 2, (a.y + b.y) / 2);
    const mx = mid.x, my = mid.y;
    /* 先跟着两指中点平移，再按两指的张开比例缩放 */
    VIEW.dx += mx - pinch.lx;
    VIEW.dy += my - pinch.ly;
    pinch.lx = mx; pinch.ly = my;
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt(pinch.k * (d / pinch.d), mx, my);
    pointerize();          // 用中点当缩放锚点，手指夹住的地方不跑
    scheduleDraw();
    return;
  }

  if (panFrom && VIEW.k > 1.001) {
    const mv = localDelta(ev.clientX - panFrom.x, ev.clientY - panFrom.y);
    VIEW.dx += mv.dx;
    VIEW.dy += mv.dy;
    panFrom = { x: ev.clientX, y: ev.clientY };
    clampView();
    scheduleDraw();
  }
});

/* zoomAt 内部已经做过锚点补偿，这里只是把「缩放倍数基准」换到当前点，
   避免连续 pointermove 时比例被反复累乘 */
function pointerize() {
  if (!pinch) return;
  const [a, b] = [...ptrs.values()];
  if (!a || !b) return;
  pinch.d = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y));
  pinch.k = VIEW.k;
}

function endPointer(ev) {
  if (!ptrs.has(ev.pointerId)) return;
  ptrs.delete(ev.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0) {
    panFrom = null;
    if (moved > 9) suppressClick = true;   // 是拖动，不是点
  }
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);

/* 桌面滚轮缩放：顺手也给电脑端加上，鼠标位置为锚点 */
stage.addEventListener('wheel', ev => {
  if (!COMPS.length) return;
  ev.preventDefault();
  const p = stagePoint(ev.clientX, ev.clientY);
  zoomAt(VIEW.k * Math.exp(-ev.deltaY * 0.0018), p.x, p.y);
  scheduleDraw();
}, { passive: false });

/* ------------------------------ 缩放按钮 ------------------------------ */
const zIn = document.getElementById('zIn');
const zOut = document.getElementById('zOut');
const zFit = document.getElementById('zFit');

function syncZoomBtn() {
  if (!zIn) return;
  zIn.disabled = VIEW.k >= K_MAX - 0.01;
  zOut.disabled = VIEW.k <= 1.01;
}

function zoomCenter(mul) {
  zoomAt(VIEW.k * mul, stage.clientWidth / 2, stage.clientHeight / 2);
  drawBase();
}
if (zIn) zIn.onclick = () => zoomCenter(1.7);
if (zOut) zOut.onclick = () => zoomCenter(1 / 1.7);
if (zFit) zFit.onclick = () => { VIEW.k = 1; VIEW.dx = 0; VIEW.dy = 0; drawBase(); };

/* ----------------------- 底部抽屉（手机：可拖、可滚） ----------------------- *
 * 三档：mini 只露分类 ｜ half 默认 ｜ full 几乎满屏。
 * 拖把手到哪儿就吸附到最近的一档，点一下则在 mini / half 之间来回。
 * -------------------------------------------------------------------------- */
const sideEl = document.getElementById('side');
const grabEl = document.getElementById('grab');
const grabTxt = document.getElementById('grabTxt');
const catsEl = document.getElementById('cats');

const DRAWER_FRAC = { half: 0.5, full: 0.85 };
let drawerState = 'half';

function miniH() {
  const a = grabEl ? grabEl.offsetHeight : 25;
  const b = catsEl ? catsEl.offsetHeight : 34;
  return Math.max(42, a + b + 2);
}

function drawerH(state) {
  if (state === 'mini') return miniH();
  const H = appEl.clientHeight || window.innerHeight;
  return Math.round(H * (DRAWER_FRAC[state] || DRAWER_FRAC.half));
}

/* 窗口转动 / 高度变化后重算，否则会停在按旧屏幕算出来的高度上 */
function fitDrawer() {
  if (!sideEl) return;
  const m = isMobileLayout();
  document.body.classList.toggle('drawerOpen', m && drawerState !== 'mini');
  if (!m) { sideEl.style.height = ''; return; }
  sideEl.style.height = drawerH(drawerState) + 'px';
}

function setDrawer(state) {
  drawerState = state;
  document.body.classList.toggle('drawerOpen', state !== 'mini');
  if (grabTxt) {
    grabTxt.textContent = state === 'mini'
      ? '上拉看分组列表'
      : (state === 'full' ? '下拉收起 · 列表' : '分组列表 · 可上下拉');
  }
  if (!isMobileLayout()) return;
  sideEl.style.height = drawerH(state) + 'px';
  /* 拉开列表时把当前这组滚到中间：否则重新打开还停在列表顶部，
     要点序号打勾还得先翻半天找自己刚才选的那行 */
  if (state !== 'mini' && active) {
    clearTimeout(setDrawer._s);
    setDrawer._s = setTimeout(() => {
      const row = document.querySelector('#list .grp.on');
      if (row) row.scrollIntoView({ block: 'center' });
    }, 40);
  }
  /* 抽屉改了画布高度，等动画完再重画（ResizeObserver 也会补一发） */
  clearTimeout(setDrawer._t);
  setDrawer._t = setTimeout(() => { if (COMPS.length) drawBase(); }, 220);
}

if (grabEl) {
  let dg = null;
  const stop = ev => {
    if (!dg) return;
    sideEl.classList.remove('drag');
    const m = dg; dg = null;
    try { grabEl.releasePointerCapture(ev.pointerId); } catch (_) { }
    if (m.moved < 8) {                       // 只是点了一下
      setDrawer(drawerState === 'mini' ? 'half' : 'mini');
      return;
    }
    /* 吸附到最近的一档 */
    let best = 'mini', bd = Infinity;
    for (const s of ['mini', 'half', 'full']) {
      const dd = Math.abs(drawerH(s) - m.h2);
      if (dd < bd) { bd = dd; best = s; }
    }
    setDrawer(best);
  };
  grabEl.addEventListener('pointerdown', ev => {
    if (!isMobileLayout()) return;
    dg = { x: ev.clientX, y: ev.clientY, h: sideEl.offsetHeight, h2: sideEl.offsetHeight, moved: 0 };
    sideEl.classList.add('drag');
    try { grabEl.setPointerCapture(ev.pointerId); } catch (_) { }
    ev.preventDefault();
  });
  grabEl.addEventListener('pointermove', ev => {
    if (!dg) return;
    dg.moved = Math.max(dg.moved, Math.hypot(ev.clientX - dg.x, ev.clientY - dg.y));
    const d = localDelta(ev.clientX - dg.x, ev.clientY - dg.y);
    let h = dg.h - d.dy;                     // 往上拖 = 抽屉变高
    h = Math.max(36, Math.min(appEl.clientHeight - 76, h));
    dg.h2 = h;
    sideEl.style.height = h + 'px';
  });
  grabEl.addEventListener('pointerup', stop);
  grabEl.addEventListener('pointercancel', stop);
}

/* --------------------------------- 导出 --------------------------------- */
function composeExport() {
  const W = layout.W, H = layout.H;
  const pol = polarOfGroup(active);
  const HDR = pol ? 100 : 74;          // 有极性就多留一条黑带的空
  const FTR = 34;
  const DPR = Math.max(2, Math.min(3, window.devicePixelRatio || 1));
  const c2 = document.createElement('canvas');
  c2.width = Math.round(W * DPR);
  c2.height = Math.round((H + HDR + FTR) * DPR);
  const g = c2.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H + HDR + FTR);

  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = '#14161a';
  g.font = '700 17px "Microsoft YaHei",sans-serif';
  g.fillText(fmtVal(active, cat) + '　' + active.fp + '　' + active.items.length + ' 颗', 16, 30);
  g.fillStyle = '#6b7280';
  g.font = '11.5px "Microsoft YaHei",sans-serif';
  g.fillText('黑块＝本组元件　数字＝序号　白点＝焊盘　已焊 ' + countMarked(active) + '/' + active.items.length, 16, 50);

  /* 打印出来贴在工位上时，极性提醒比什么都重要 —— 印成黑底白字一条 */
  if (pol) {
    const tip = '⚑ ' + (pol.all ? '全部有方向：' : '部分有方向：') +
      (POLAR_TIP[pol.kind] || '').replace(/<\/?b>/g, '');
    g.fillStyle = '#14161a';
    g.fillRect(12, 58, W - 24, 26);
    g.fillStyle = '#fff';
    let fs = 12.5;
    g.font = '600 ' + fs + 'px "Microsoft YaHei",sans-serif';
    while (g.measureText(tip).width > W - 44 && fs > 9) {
      fs -= 0.5;
      g.font = '600 ' + fs + 'px "Microsoft YaHei",sans-serif';
    }
    g.fillText(tip, 22, 76);
  }

  g.drawImage(cvBase, 0, HDR, W, H);

  const ordered = active._ordered || orderItems(active.items);
  let line = ordered.map((c, i) => (i + 1) + '.' + c.d).join('　');
  if (line.length > 130) line = line.slice(0, 128) + ' …';
  g.fillStyle = '#6b7280'; g.font = '11px "Microsoft YaHei",sans-serif';
  g.fillText(line, 16, H + HDR + 20);
  return c2;
}

async function exportPng() {
  if (!active) return;
  const c2 = composeExport();
  const blob = await new Promise(r => c2.toBlob(r, 'image/png'));
  const name = '焊接_' + cat + '_' + String(active.v || 'NA').replace(/[\\/:*?"<>|]/g, '_') + '_' + active.fp + '.png';
  try {
    if (!EDA) throw new Error('no eda');
    await EDA.sys_FileSystem.saveFile(blob, name);
  } catch (e) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }
}

/* ------------------- 导出：单文件交互网页（离线可点） -------------------- *
 * 思路：把本页的 <style>、#app 外壳、主脚本原样搬进一个新 HTML，
 * 再把当前 PCB 数据以 window.__EMBED__ 的形式内嵌进去。
 * 好处：导出页和插件里跑的是同一份代码，永远不会出现两套逻辑。
 * ------------------------------------------------------------------------ */
const escHtml = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function buildStandalone() {
  const css = document.querySelector('style[data-app]').textContent;
  const js = document.querySelector('script[data-app]').textContent;
  const shell = SHELL || document.getElementById('app').outerHTML;
  const payload = {
    v: 2,
    proj: PROJ,
    name: PROJNAME || '',
    cat: cat,
    g: active ? (active.raw || active.v || '') : '',
    board: BOARD,
    comps: COMPS.map(c => ({
      d: c.d, v: c.v, fp: c.fp, layer: c.layer, x: c.x, y: c.y,
      angle: Number(c.angle) || 0, box: c.box || null, padR: c.padR || 0, syn: c.syn !== false,
      pins: (c.pins || []).map(p => [p[0], p[1], 0, p[3] || 0, p[4] || 0, p[5] || 0, p[6] || 'rect']),
    })),
  };
  const title = '焊接分组' + (PROJNAME ? ' · ' + PROJNAME : '');
  const CLOSE = '<' + '/script>';   // 拆开写，避免把本文件自己提前闭合
  return [
    '<!DOCTYPE html>',
    '<html lang="zh-CN">',
    '<head>',
    '<meta charset="utf-8">',
    '<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">',
    '<title>' + escHtml(title) + '</title>',
    '<style>' + css + '</style>',
    '</head>',
    '<body>',
    shell,
    '<script>window.__EMBED__=' + JSON.stringify(payload) + ';' + CLOSE,
    '<script>' + js + CLOSE,
    '</body>',
    '</html>',
  ].join('\n');
}

async function exportHtmlFile() {
  let html;
  try { html = buildStandalone(); } catch (e) { toast('生成失败：' + e.message); return; }
  const nm = ('焊接分组' + (PROJNAME ? '_' + PROJNAME : '') + '_交互版.html')
    .replace(/[\\/:*?"<>|]/g, '_');
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  try {
    if (!EDA) throw new Error('no eda');
    await EDA.sys_FileSystem.saveFile(blob, nm);
    toast('已导出 ' + nm + '　双击即可在浏览器里点选');
  } catch (e) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = nm;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast('已保存 ' + nm);
  }
}

function doPrint() {
  if (!active) return;
  const url = composeExport().toDataURL('image/png');
  const w = window.open('', '_blank', 'width=1000,height=780');
  if (!w) { toast('窗口被拦截，请改用「导出 PNG」'); return; }
  w.document.write('<html><head><meta charset="utf-8"><title>焊接分组</title>' +
    '<style>body{margin:0;display:grid;place-items:center}img{max-width:100%}' +
    '@media print{img{max-height:98vh}}</style></head><body>' +
    '<img src="' + url + '" onload="setTimeout(function(){window.print()},300)"></body></html>');
  w.document.close();
}

/* ------------------------- 在 PCB 中同步选中（可选） ---------------------- */
async function selectInPcb() {
  if (!active || !EDA) return;
  try {
    await EDA.pcb_SelectControl.clearSelected();
    await EDA.pcb_SelectControl.doSelectPrimitives(active.items.map(c => c.pid));
    toast('已在 PCB 中选中 ' + active.items.length + ' 个元件，关掉本窗口即可看到');
  } catch (e) {
    toast('选中失败：' + e.message);
  }
}

let toastTimer = 0;
function toast(s) {
  hintEl.textContent = s;
  hintEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => hintEl.classList.remove('show'), 3000);
}

/* --------------------------------- 启动 --------------------------------- */
function fail(html) {
  document.getElementById('list').innerHTML = '<div id="empty">' + html + '</div>';
  document.getElementById('h1').textContent = '没有数据';
}

/* 统一入口：拿到数据后定默认类别、渲染、再按 URL / 顶栏指定选中某个分组 */
function readHashGroup() {
  const m = /(?:^#|&)g=([^&]*)/.exec(location.hash || '');
  if (!m) return '';
  try { return decodeURIComponent(m[1]); } catch (_) { return ''; }
}

/* 老数据（内嵌示例、早先导出的网页）只有四个角点的虚拟焊盘，没有本体尺寸。
   这里按封装名补算一次，让它们也享受「排针画成细长条」的修正，不用重新导出工程。 */
function normalizeComps(list) {
  if (!list) return list;
  let fixed = 0;
  for (const c of list) {
    /* 老导出包 / 老缓存：焊盘只有中心点，没有尺寸（p[4] 缺失）。
       坐标如果是 EDA 给的真实值就别动，只按封装名补一套尺寸上去，
       否则整张图又会退回「一堆小圆点」。 */
    const ps0 = c.pins || [];
    if (ps0.length && !Number(ps0[0][4])) {
      const geo0 = makePads(fpGeom(c.fp), estimateSize(c.fp),
        Number(c.x) || 0, Number(c.y) || 0, Number(c.angle) || 0);
      const t = geo0.pads;
      c.pins = ps0.map((p, i) => {
        const q = t[i] || t[t.length - 1] || null;
        return [p[0], p[1], p[2] || '', p[3] || '',
          q ? q[4] : 0, q ? q[5] : 0, q ? q[6] : 'rect'];
      });
      if (!c.padR) c.padR = geo0.padR;
    }

    if (c.box && c.box[0] > 0) continue;
    if (c.syn === false) continue;          // EDA 给的真实焊盘，不能覆盖
    const geo = makePads(fpGeom(c.fp), estimateSize(c.fp),
      Number(c.x) || 0, Number(c.y) || 0, Number(c.angle) || 0);
    c.pins = geo.pads;
    c.box = geo.box;
    c.padR = geo.padR;
    c.syn = true;
    fixed++;
  }
  return list;
}

function applyData(comps, board, opt) {
  opt = opt || {};
  COMPS = normalizeComps(comps) || [];
  BOARD = board || null;
  if (!COMPS.length) { fail('没有读到器件'); return; }

  const q = new URLSearchParams(location.search);
  const want = (q.get('cat') || opt.cat || '').toUpperCase();
  const curCat = CATS.find(x => x.id === cat) || CATS[0];
  if (CATS.some(x => x.id === want)) cat = want;
  else if (!COMPS.some(c => catOf(c) === curCat.id)) {
    cat = COMPS.some(c => catOf(c) === 'R') ? 'R' : (COMPS.some(c => catOf(c) === 'C') ? 'C' : 'R');
  }

  groups = buildGroups(cat);

  const g = q.get('g') || readHashGroup() || opt.g;
  if (g) {
    /* #g=10K 按值定位；#g=R24 按位号定位到它所在的那一组。
       位号可能不在当前分类里（比如 U13 是排针，归在接插件），
       这时自动切到它所在的分类，不用手动点。 */
    let t = groups.find(x => normVal(x.v) === normVal(g))
      || groups.find(x => x.items.some(c => String(c.d).toUpperCase() === String(g).toUpperCase()));
    if (!t) {
      for (const k of CATS) {
        if (k.id === cat) continue;
        const gs = buildGroups(k.id);
        const tt = gs.find(x => normVal(x.v) === normVal(g))
          || gs.find(x => x.items.some(c => String(c.d).toUpperCase() === String(g).toUpperCase()));
        if (tt) { cat = k.id; groups = gs; t = tt; break; }
      }
    }
    if (t) { active = t; loadMarks(t); renderList(); renderCats(); drawBase(); return; }
  }

  renderCats(); renderList(); drawBase();
}

/* 是不是被嘉立创EDA 的窗口装着跑（插件模式）。
   是的话就必须读正在编辑的这块 PCB，不能拿本机缓存/示例顶上去。 */
function inEdaFrame() {
  try {
    const e = window.eda || (window.parent && window.parent !== window ? window.parent.eda : null);
    return !!(e && e.pcb_PrimitiveComponent);
  } catch (_) { return false; }
}

async function boot() {
  /* ① 导出的单文件网页：数据已内嵌，不连 EDA、不联网 */
  if (window.__EMBED__) {
    const j = window.__EMBED__;
    SOLO = true;
    document.body.classList.add('solo');
    PROJ = j.proj || 'standalone';
    PROJNAME = j.name || '';
    document.title = '焊接分组' + (PROJNAME ? ' · ' + PROJNAME : '') + '（离线交互版）';
    /* 离线页没有 EDA、也没有拖拽层：这两个按钮点了什么都不会发生，索性藏掉 */
    ['btnSel', 'btnOpen'].forEach(id => {
      const b = document.getElementById(id);
      if (b) b.style.display = 'none';
    });
    applyData(j.comps || [], j.board || null, { cat: j.cat, g: j.g });
    return;
  }

  /* ② 浏览器直接打开 + ?demo=1：读演示数据（开发自检用） */
  if (location.search.indexOf('demo=1') >= 0) {
    try {
      let r = await fetch('./demo-data.json');
      if (!r.ok) r = await fetch('./iframe/demo-data.json');
      const j = await r.json();
      PROJ = 'demo'; PROJNAME = 'DEMO';
      applyData(j.comps, j.outline, { cat: 'R' });
      return;
    } catch (_) { /* 落到 ③ */ }
  }

  /* ③ 工程文件模式：本机缓存 → 预置示例 → 等拖入
     插件窗口里跳过这一步，直接去读正在编辑的 PCB */
  if (!inEdaFrame()) {
    const saved = readSaved();
    const init = (saved && saved.comps && saved.comps.length) ? saved : window.__DEFAULT__;
    if (init && init.comps && init.comps.length) {
      SOLO = true;
      USING_DEFAULT = !(saved && saved.comps && saved.comps.length);
      document.body.classList.add('solo');
      PROJNAME = init.name || '';
      document.title = '焊接分组 · ' + (PROJNAME || '工程');
      const bs2 = document.getElementById('btnSel');
      if (bs2) bs2.style.display = 'none';
      applyData(init.comps, init.board || null, {});
      return;
    }
    /* 空工坊（没内嵌数据、也没缓存）：标题不能留「正在读取当前 PCB」，
       否则对方会以为程序卡住了，一直在等一个不会出现的结果 */
    const h1e = document.getElementById('h1'), sube = document.getElementById('sub');
    if (h1e) h1e.textContent = '等待导入工程';
    if (sube) sube.innerHTML = '拖入 .epro2 后自动生成分组图　|　全程本机解析，不上传、不联网';
    showDrop('');
    return;
  }

  /* ④ 插件模式：连嘉立创EDA，读正在编辑的这块 PCB */
  EDA = await getEda();
  if (!EDA) { fail('未检测到嘉立创EDA环境<br><span style="color:#9aa0a6">请在 PCB 编辑器中通过菜单打开本插件</span>'); return; }
  /* 板子就在 EDA 里，不需要「导入工程」这颗按钮 */
  const bo = document.getElementById('btnOpen');
  if (bo) bo.style.display = 'none';
  try {
    try {
      const info = await EDA.dmt_Project.getCurrentProjectInfo();
      if (info && info.uuid) PROJ = info.uuid;
      if (info && (info.name || info.title)) PROJNAME = info.name || info.title;
    } catch (_) { }
    COMPS = await loadFromEda(EDA);
    BOARD = await loadBoard(EDA);
    if (!COMPS.length) { fail('当前 PCB 里没有读到器件'); return; }
    applyData(COMPS, BOARD);
  } catch (e) {
    fail('读取 PCB 失败：' + e.message);
  }
}

/* 导出的交互网页里只有 #app 这一层（没有拖拽层），部分按钮根本不存在。
   直接 .onclick 赋值会抛 TypeError，把后面的 boot() 一起中断掉 —— 必须容错。 */
function on(id, fn) { const el = document.getElementById(id); if (el) el.onclick = fn; }
on('btnHtml', exportHtmlFile);
on('btnPng', exportPng);
on('btnPrint', doPrint);
on('btnSel', selectInPcb);

/* 键盘切换：↑↓ 换分组，Esc 取消选中（离线页和插件里都可用） */
window.addEventListener('keydown', ev => {
  if (ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
  if (ev.key === 'Escape') hideDrop();
  if (!groups.length) return;
  const k = ev.key;
  if (k === 'ArrowDown' || k === 'ArrowUp') {
    ev.preventDefault();
    let i = active ? groups.findIndex(g => g.key === active.key) : -1;
    i = k === 'ArrowDown'
      ? Math.min(groups.length - 1, i + 1)
      : Math.max(0, i < 0 ? 0 : i - 1);
    selectGroup(groups[i], i);
  } else if (k === 'Escape') {
    active = null; marks = {};
    renderList(); drawBase();
    try { history.replaceState(null, '', location.pathname + location.search); } catch (_) { }
  }
});

let rt = 0;
function onViewportChange() {
  clearTimeout(rt);
  rt = setTimeout(() => {
    applyOrient();                     // 竖拿/横拿切换：转页面、重算抽屉
    if (COMPS.length) drawBase();
  }, 120);
}
window.addEventListener('resize', onViewportChange);
/* iOS 转屏时 resize 会早于尺寸稳定，晚一点再量一次 */
window.addEventListener('orientationchange', () => setTimeout(onViewportChange, 260));
if (window.visualViewport) window.visualViewport.addEventListener('resize', onViewportChange);

/* 画布尺寸必须跟着容器走。窗口 resize 事件管不到「抽屉展开」「手机键盘弹出」
   这类只改容器高度的情况 —— 不监听就会画出比容器高的画布，被裁掉一半。
   ResizeObserver 是唯一可靠的办法。 */
if (window.ResizeObserver) {
  let lastW = 0, lastH = 0, rzT = 0;
  new ResizeObserver(() => {
    const w = stage.clientWidth, h = stage.clientHeight;
    if (!COMPS.length || !w || !h) return;
    if (Math.abs(w - lastW) < 2 && Math.abs(h - lastH) < 2) return;
    lastW = w; lastH = h;
    /* 抽屉动画期间会连触发几十次，攒 60ms 画一次就够，
       而且不用 requestAnimationFrame —— 后台标签页里 rAF 会被暂停 */
    clearTimeout(rzT);
    rzT = setTimeout(() => { if (COMPS.length) drawBase(); }, 60);
  }).observe(stage);
}

/* 拖入 / 选择工程文件 */
let needFile = true;
on('btnOpen', () => showDrop(''));
on('btnCancel', hideDrop);
on('btnPick', () => {
  /* APK 里交给原生弹面板：多一个「微信 / QQ 收到的文件」的入口。
     浏览器和插件里没有 AndroidBridge，照旧点那个隐藏的 input。 */
  if (IN_APK) {
    try { AndroidBridge.pick(); return; } catch (_) { }
  }
  const f = document.getElementById('fileIn'); if (f) f.click();
});
/* 导出交互网页里没有这个 input，取不到就别绑 */
const fileInEl = document.getElementById('fileIn');
if (fileInEl) {
  fileInEl.onchange = ev => {
    const f = ev.target.files && ev.target.files[0];
    if (f) openProject(f);
    ev.target.value = '';
  };
}

/* 原生外壳递进来的文件（微信/QQ「用其他应用打开」，或面板里翻出来的那个）。
   文件存在原生那边，这里 fetch 一次把字节拉过来 —— 不走 base64 塞 JS 桥，
   是因为 .epro2 可能几 MB，长字符串过桥容易被截断，还会把主线程卡住。 */
window.__onExternalFile = async function () {
  let name = 'project.epro2';
  try {
    if (window.AndroidBridge && AndroidBridge.incomingName) name = AndroidBridge.incomingName();
  } catch (_) { }
  try {
    const r = await fetch('/__incoming__', { cache: 'no-store' });
    if (!r.ok) throw new Error('读不到文件（HTTP ' + r.status + '）');
    const buf = await r.arrayBuffer();
    if (!buf.byteLength) throw new Error('文件是空的');
    openProject(new File([buf], name, { type: 'application/zip' }));
  } catch (e) {
    showDrop('读不到这个文件：' + (e.message || e));
    const err = document.getElementById('dropErr');
    if (err) err.style.color = '#A32D2D';
  }
};

/* 点遮罩空白处也能退出（已经有板子在显示时） */
const dropEl = document.getElementById('drop');
if (dropEl) {
  dropEl.addEventListener('click', ev => {
    if (ev.target === dropEl && COMPS.length) hideDrop();
  });
}

window.addEventListener('dragover', ev => {
  const el = document.getElementById('drop');
  if (!el) return;                 // 导出交互网页没有拖拽层
  ev.preventDefault();
  el.classList.add('on'); el.classList.add('hot');
});

window.addEventListener('dragleave', ev => {
  if (ev.relatedTarget) return;
  const el = document.getElementById('drop');
  if (!el) return;
  el.classList.remove('hot');
  if (!needFile) el.classList.remove('on');
});

window.addEventListener('drop', ev => {
  ev.preventDefault();
  const el = document.getElementById('drop');
  if (!el) return;
  el.classList.remove('hot');
  const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
  if (f) { needFile = false; openProject(f); }
  else if (!COMPS.length) showDrop('选进来的是文件夹或空内容，请直接选 .epro2 文件');
});

/* 先定横屏/竖屏与抽屉高度，再进 boot：否则第一帧会按错的画布尺寸画一次 */
applyOrient();
boot();

</script>
<script>
/* 断网也能开：sw.js 用 network-first，联网时永远拿最新的，断网才回落缓存。
   Service Worker 只在安全上下文里能用 —— https，或者 localStorage 那种 localhost。
   本地 http:// 打开、以及 file:// 双击时都注册不了，吞掉就行，不影响页面。 */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var h = location.hostname;
  var secure = location.protocol === 'https:' || h === 'localhost' || h === '127.0.0.1';
  if (!secure) return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { });
  });
})();
</script>
