<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 手机端必须：没有这行会被当成 980px 宽的桌面页渲染，下面的窄屏样式永远不生效 -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>焊接分组 · 嘉立创工程焊接辅助</title>
<style data-app>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.45 "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    color: #14161a; background: #fff; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; height: 100%; }

  /* ---------------- 左侧 ---------------- */
  #side {
    width: 252px; flex: 0 0 252px; display: flex; flex-direction: column;
    background: #fbfbfc; border-right: 1px solid #e3e5e8;
  }
  #cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 9px 9px 8px; border-bottom: 1px solid #e3e5e8; }
  #cats button {
    width: 100%; min-width: 0; font: inherit; font-size: 11.5px; padding: 5px 1px;
    cursor: pointer; white-space: nowrap; overflow: hidden;
    background: #fff; border: 1px solid #dcdfe3; border-radius: 5px; color: #4a5058;
  }
  #cats button:hover { background: #f2f3f5; }
  #cats button.on { background: #14161a; border-color: #14161a; color: #fff; font-weight: 700; }
  #cats button .n { font-size: 10.5px; opacity: .65; margin-left: 2px; }
  #cats button:disabled { opacity: .38; }

  #list { flex: 1; overflow-y: auto; padding: 6px 8px 12px; }
  .grp {
    display: block; width: 100%; text-align: left; cursor: pointer; font: inherit; color: inherit;
    background: transparent; border: 1px solid transparent; border-left: 3px solid transparent;
    border-radius: 5px; padding: 7px 8px 6px; margin-bottom: 1px;
  }
  .grp:hover { background: #f0f1f3; }
  .grp.on { background: #fff; border-color: #d8dbdf; border-left-color: #14161a; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .grp .l1 { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .grp .nm { font-weight: 700; font-size: 13.5px; letter-spacing: .2px; white-space: nowrap; flex: 0 0 auto; }
  .grp .fp {
    font-size: 10px; color: #6b7280; border: 1px solid #dcdfe3; border-radius: 3px;
    padding: 0 3px; line-height: 14px; white-space: nowrap;
    max-width: 112px; overflow: hidden; text-overflow: ellipsis;
    flex: 0 1 auto; min-width: 0;
  }
  .grp .ct { margin-left: auto; font-size: 11px; color: #6b7280; font-variant-numeric: tabular-nums; }
  /* 有极性标记：黑底白字的小方牌，靠明暗而不是颜色，色弱也看得出 */
  .grp .pl {
    font-size: 9.5px; line-height: 13px; padding: 0 3px; border-radius: 3px;
    background: #14161a; color: #fff; white-space: nowrap; letter-spacing: .3px;
    align-self: center; flex: 0 0 auto;
  }
  .grp .pl.part { background: #fff; color: #14161a; border: 1px solid #14161a; }
  .chip .pd { font-size: 9px; line-height: 1; padding: 1px 2px; border-radius: 2px; background: #14161a; color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 1px 4px 8px 12px; }
  .chip {
    font: inherit; font-size: 11px; cursor: pointer; background: #fff; color: #14161a;
    border: 1px solid #d8dbdf; border-radius: 4px; padding: 1px 5px 1px 2px;
    display: inline-flex; align-items: center; gap: 3px;
  }
  .chip b {
    min-width: 12px; text-align: center; background: #14161a; color: #fff;
    border-radius: 2px; font-size: 10px; font-weight: 700; padding: 0 2px;
  }
  .chip:hover { border-color: #9aa0a6; background: #f6f7f8; }
  #empty { padding: 18px 14px; color: #8a9099; font-size: 12px; line-height: 1.8; }

  /* ---------------- 右侧 ---------------- */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { padding: 10px 16px 9px; border-bottom: 1px solid #e3e5e8; display: flex; align-items: center; gap: 14px; }
  header .tt { flex: 1; min-width: 0; }
  header h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .2px; display: flex; align-items: baseline; gap: 8px; }
  header h1 .fp { font-size: 11px; font-weight: 400; color: #6b7280; border: 1px solid #dcdfe3; border-radius: 3px; padding: 0 4px; }
  header h1 .cnt { font-weight: 400; color: #4a5058; font-size: 13px; }
  header p { margin: 3px 0 0; font-size: 11.5px; color: #8a9099; }
  header p b { color: #14161a; font-variant-numeric: tabular-nums; }
  /* 极性提醒：黑底白字独占一行，焊之前一定会看见 */
  header p .pwarn {
    display: block; margin-top: 5px; padding: 4px 9px; border-radius: 4px;
    background: #14161a; color: #fff; font-size: 11.5px; line-height: 1.55;
  }
  header p .pwarn b { color: #fff; text-decoration: underline; }
  .acts { display: flex; gap: 6px; flex: 0 0 auto; }
  button.b {
    font: inherit; font-size: 12px; color: #14161a; background: #fff;
    border: 1px solid #dcdfe3; border-radius: 5px; padding: 5px 11px; cursor: pointer;
  }
  button.b:hover { background: #f2f3f5; border-color: #c5cad0; }
  button.b:disabled { opacity: .42; cursor: default; }
  button.b.pri { background: #14161a; border-color: #14161a; color: #fff; font-weight: 700; }
  button.b.pri:hover { background: #2a2f37; border-color: #2a2f37; }
  button.b.pri:disabled { background: #fff; color: #14161a; }
  /* 顶部推广入口：深色胶囊 + 外链箭头，跟功能按钮一眼分开 */
  .promo { display: flex; gap: 6px; flex: 0 0 auto; }
  a.promo-btn {
    font: inherit; font-size: 12px; font-weight: 700; text-decoration: none;
    color: #fff; background: #14161a; border: 1px solid #14161a; border-radius: 5px;
    padding: 5px 11px; white-space: nowrap;
  }
  a.promo-btn::after { content: ' ↗'; font-weight: 400; }
  a.promo-btn:hover { background: #2a2f37; border-color: #2a2f37; }

  #stage {
    flex: 1; position: relative; min-height: 0; background: #fff; overflow: hidden;
    /* 关键：交给 JS 自己处理手指，否则浏览器会抢走单指滚动和双指缩放 */
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  #cvBase, #cvFx { position: absolute; left: 0; top: 0; }
  #cvFx { pointer-events: none; }
  #hint {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: rgba(20,22,26,.92); color: #fff; font-size: 11.5px; padding: 6px 12px;
    border-radius: 14px; pointer-events: none; opacity: 0; transition: opacity .25s;
    white-space: nowrap;
  }
  #hint.show { opacity: 1; }

  /* ---------- 缩放按钮（右下角浮层，手机上手指够得着） ---------- */
  #zoom {
    position: absolute; right: 10px; bottom: 16px; z-index: 5;
    display: flex; flex-direction: column; gap: 6px;
  }
  #zoom button {
    width: 34px; height: 34px; padding: 0; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(255,255,255,.94); border: 1px solid #d8dade; color: #14161a;
    font: 600 17px/1 "Microsoft YaHei",sans-serif; cursor: pointer;
    box-shadow: 0 1px 3px rgba(0,0,0,.10);
    -webkit-tap-highlight-color: transparent;
  }
  #zoom button:active { background: #14161a; color: #fff; }
  #zoom button:disabled { opacity: .3; }

  /* ---------- 底部抽屉把手（窄屏才出现） ---------- */
  #grab {
    display: none; align-items: center; justify-content: center; gap: 7px;
    height: 26px; flex: 0 0 auto; cursor: pointer; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #grab i { display: block; width: 30px; height: 4px; border-radius: 2px; background: #d2d5da; }
  #grab span { font-size: 10.5px; color: #8a9099; }

  /* ======================================================================
   *  手机 / 窄屏：横屏工位模式
   *  焊接时板子摊在桌上，手机只能立在旁边，屏幕净高就 300 出头，
   *  所以顶栏不再占一行：左上角只留一颗「导入工程」，当前分组的信息搬进
   *  底部抽屉的头一行，板图铺满整屏；分组列表收在抽屉里，能拖、能滚，
   *  点法和电脑上完全一样。竖着拿手机时整页会转 90°（见 body.rot）。
   * ====================================================================== */
/* 手机布局的触发条件，三个里命中任意一个即可：
     pointer: coarse  桌面浏览器不满足，触屏设备满足
     max-width: 760px 竖屏手机、窄窗口
     max-height: 520  ← 关键。横屏手机视口高度只有 390 左右，宽度却是 844，
                       只按宽度判断会掉回桌面布局（侧栏 252px 把板图挤没）。
                       桌面窗口极少矮到这个程度，所以不会误伤。
   宁可多命中，也不能让「横屏手机 + 定制 WebView 不报 coarse」变成桌面版。 */
@media (pointer: coarse), (max-width: 760px), (max-height: 520px) {
    #app {
      flex-direction: column-reverse;
      width: 100%; max-width: 100%; overflow: hidden;
    }
    main { position: relative; flex: 1 1 auto; min-height: 0; }

    /* 顶栏在手机上只剩左上角那颗「导入工程」，整幅板图让出来 */
    header {
      position: absolute; left: 0; top: 0; z-index: 9;
      padding: 6px; border: 0; background: none; pointer-events: none;
    }
    header > * { pointer-events: auto; }
    #btnOpen {
      flex: 0 0 auto; padding: 7px 12px; font-size: 11.5px; font-weight: 700;
      background: #14161a; border-color: #14161a; color: #fff;
      box-shadow: 0 1px 4px rgba(20,22,26,.22);
    }
    /* 手机上除了导入，其余都是「在电脑前干的事」，收起来不碍事 */
    .acts { display: none; }
    /* 推广入口留在右上角：手机上也能点到，手指尺寸给够，字体收小一点 */
    #promo { position: absolute; right: 6px; top: 6px; }
    #promo a.promo-btn { font-size: 11.5px; padding: 8px 10px; }

    /* ---------------- 底部抽屉 ---------------- */
    #side {
      position: relative; z-index: 8;
      width: 100%; max-width: 100%; min-width: 0; flex: 0 0 auto;
      display: flex; flex-direction: column; overflow: hidden;
      height: 50%;
      background: #fbfbfc; border-right: 0; border-top: 1px solid #e3e5e8;
      box-shadow: 0 -6px 16px rgba(20,22,26,.07);
      transition: height .19s cubic-bezier(.22,.7,.28,1);
    }
    #side.drag { transition: none; }

    /* 抽屉顶那一条：左边是拖动把手，中间是「当前分组」，右边提示怎么拉。
       当前分组的信息是 JS 从顶栏搬过来的（不是浮在板图上），不会挡住元件。 */
    #grab {
      display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
      height: auto; min-height: 30px; padding: 4px 10px;
      cursor: grab; touch-action: none; -webkit-tap-highlight-color: transparent;
    }
    #grab i {
      display: block; flex: 0 0 auto; width: 3px; height: 20px; border-radius: 2px;
      background: #d2d5da;
    }
    body.drawerOpen #grab i { background: #14161a; }
    #ttSlot { flex: 1 1 auto; min-width: 0; }
    #grabTxt { flex: 0 0 auto; font-size: 9.5px; color: #9aa0a6; letter-spacing: .2px; }

    /* 搬进抽屉的标题块：去掉桌面上的卡片外观，当普通文字用 */
    #grab .tt { padding: 0; background: none; border: 0; box-shadow: none; }
    #grab .tt h1 { font-size: 12.5px; gap: 5px; display: flex; align-items: baseline; }
    #grab .tt h1 > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #grab .tt h1 .fp {
      font-size: 9.5px; padding: 0 3px; max-width: 110px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #grab .tt h1 .cnt { font-size: 11px; }
    #grab .tt p { margin: 1px 0 0; font-size: 10px; line-height: 1.35; }
    #grab .tt p .pwarn {
      display: block; margin-top: 3px; padding: 3px 7px; border-radius: 4px;
      background: #14161a; color: #fff; font-size: 9.5px; line-height: 1.45;
    }
    #grab .tt p .pwarn b { color: #fff; text-decoration: underline; }

    #cats { flex: 0 0 auto; padding: 0 6px 6px; grid-template-columns: repeat(5, 1fr); gap: 4px; }
    #cats button { width: 100%; min-width: 0; padding: 6px 0; font-size: 11px; white-space: nowrap; overflow: hidden; }
    #cats button .n { font-size: 9.5px; }

    /* 列表本体：手指直接滚，行高按手指给足 */
    #list {
      flex: 1 1 auto; min-height: 0; overflow-y: auto;
      -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
      padding: 4px 6px 14px;
    }
    .grp { padding: 8px 8px 7px; }
    .grp .nm { font-size: 13px; }
    .grp .fp { max-width: 96px; }
    .grp .pl { font-size: 9px; }
    .chips { padding: 2px 4px 8px 10px; gap: 5px; }
    .chip { font-size: 11.5px; padding: 4px 8px 4px 3px; }

    /* 手指点不准 34px 的圆钮，放大到 42；横着排 —— 横屏时高度不够竖着放三个 */
    #zoom { right: 8px; bottom: 8px; flex-direction: row; gap: 7px; }
    #zoom button { width: 42px; height: 42px; font-size: 20px; }
    #hint { bottom: 56px; font-size: 11px; max-width: calc(100% - 84px); }
  }

  /* ---------- 竖着拿手机：整页转 90° 当横屏用 ----------
     手机上浏览器不许网页锁方向（iOS 根本不支持），
     所以干脆自己把整页转过来 —— 反正手要转，界面先转好等着。
     宽高由 JS 按视口写完（见 applyOrient），这里只留定位和裁剪。 */
  body.rot { overflow: hidden; background: #fff; }
  body.rot #app {
    position: fixed; left: 0; top: 0; transform-origin: 0 0;
    /* 转过来以后「宽」用的是竖屏的高，比窗口宽得多，不能被 max-width 夹住 */
    max-width: none; box-shadow: none;
  }
  body.rot #side, body.rot main { max-width: none; }
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="description" content="导入嘉立创 EDA 工程，自动按阻值/容值/封装分组，生成可点选的焊接板图。纯本机解析，不上传。">
</head>
<body>
<style>
#drop { position: fixed; inset: 0; z-index: 90; background: rgba(250,250,248,.97);
  display: none; place-items: center; padding: 24px; }
#drop.on { display: grid; }
#drop .dz { border: 2px dashed #c9ccd1; border-radius: 14px; background: #fff;
  padding: 34px 40px; text-align: center; max-width: 560px; transition: border-color .12s, background .12s; }
#drop.hot .dz { border-color: #14161A; background: #F4F4F1; }
#drop .t1 { font-size: 16px; font-weight: 500; color: #1f2328; margin-bottom: 6px; }
#drop .t2 { font-size: 12.5px; color: #6b7280; line-height: 1.7; }
#drop .t2 code { background: #f2f3f5; padding: 1px 5px; border-radius: 3px; font-size: 12px; }
#drop .t3 { margin-top: 16px; font-size: 11.5px; color: #9aa0a6; }
#drop .err { margin-top: 12px; font-size: 12.5px; color: #A32D2D; display: none; }
#drop .err.on { display: block; }

/* 手机上没有「拖」这回事，只留一颗「选择文件」按钮，手指够得着 */
@media (pointer: coarse), (max-width: 760px), (max-height: 520px) {
  #drop { padding: 12px; }
  #drop .dz { padding: 20px 14px; max-width: 100%; border-radius: 12px; }
  #drop .t1 { font-size: 15px; }
  #drop .t2 { font-size: 11.5px; line-height: 1.6; }
  #drop .t3 { margin-top: 10px; font-size: 10.5px; }
  /* 按钮按手指大小给：高度 40 左右，间距拉开 */
  #drop .dz button { padding: 10px 22px !important; font-size: 13.5px; }
  #btnPick { font-weight: 700; }
}
/* 多板切换：一行小胶囊按钮，当前那块高亮。单板工程整行不显示 */
#boards { display: none; gap: 6px; margin-bottom: 7px; flex-wrap: wrap; }
#boards.on { display: flex; }
#boards .bk {
  font: inherit; font-size: 12.5px; line-height: 1.35; padding: 4px 11px;
  border-radius: 99px; border: .5px solid currentColor; background: transparent;
  color: inherit; cursor: pointer; opacity: .55; white-space: nowrap;
}
#boards .bk:hover { opacity: .85; }
#boards .bk.cur { opacity: 1; font-weight: 700; box-shadow: inset 0 0 0 1px currentColor; }
</style>
<!-- 拖拽 / 选文件层。放在 #app 里面：手机竖着拿时整页会转 90°，
     留在外面它就不跟着转，会横躺着盖在屏幕上。 -->
<div id="app">
  <aside id="side">
    <div id="grab"><i></i><div id="ttSlot"></div><span id="grabTxt">分组列表</span></div>
    <div id="cats"></div>
    <div id="list"><div id="empty">读取中…</div></div>
  </aside>

  <main>
    <header>
      <!-- 手机上这一颗固定在左上角，是唯一的入口；电脑上就排在标题左边 -->
      <button class="b" id="btnOpen">导入工程</button>
      <div class="tt" id="ttBox">
        <!-- 多板工程才显示：一块板时整行隐藏，不占地方 -->
        <div id="boards"></div>
        <h1 id="h1">焊接分组</h1>
        <p id="sub">点左侧分组，板上同阻值同封装的元件会变黑并跳动</p>
      </div>
      <div class="acts">
        <button class="b" id="btnSel" disabled>在 PCB 中选中</button>
        <button class="b pri" id="btnHtml" disabled>导出交互网页</button>
        <button class="b" id="btnPng" disabled>导出 PNG</button>
        <button class="b" id="btnPrint" disabled>打印</button>
      </div>
      <div class="promo" id="promo"></div>
    </header>
    <div id="stage">
      <canvas id="cvBase"></canvas>
      <canvas id="cvFx"></canvas>
      <div id="hint"></div>
      <div id="zoom">
        <button id="zIn" title="放大">＋</button>
        <button id="zOut" title="缩小">－</button>
        <button id="zFit" title="回到适应窗口" aria-label="回到适应窗口"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2.2 6V2.2H6M14 6V2.2H10M2.2 10v3.8H6M14 10v3.8H10"/></svg></button>
        <!-- 双面贴装的板子才有：点一下把板子翻过来，看/焊背面元件 -->
        <button id="btnSide" title="翻板：切换到背面" aria-label="翻板" style="display:none;font-size:13px;font-weight:700">顶</button>
      </div>
    </div>
  </main>

  <div id="drop">
    <div class="dz">
      <div class="t1">把嘉立创工程文件拖进来</div>
      <div class="t2">支持 <code>.epro2</code>（EDA 里「文件 → 导出 → 嘉立创EDA 工程」得到的那个包）<br>
        拖入后自动读出器件、位号、阻值容值、封装和板框</div>
      <div style="margin-top:16px;display:flex;gap:8px;justify-content:center">
        <button class="b" id="btnPick" style="padding:6px 18px">选择文件…</button>
        <button class="b" id="btnCancel" style="padding:6px 14px">取消</button>
      </div>
      <input type="file" id="fileIn" accept=".epro2,.zip,application/zip,application/x-zip-compressed,application/octet-stream" hidden>
      <div class="t3">全部在本机解析，不上传、不联网、不花钱</div>
      <div class="err" id="dropErr"></div>
    </div>
  </div>
</div>

<script data-app>
/* =========================================================================
 *  焊接分组 · 点选视图  —  嘉立创EDA 专业版扩展
 *  纯本地脚本 API（eda.*）：不联网、不调 AI、无调用成本
 *  编码方式：只用「明暗 + 形状 + 动画」，不依赖颜色（色弱可用）
 *  另外可导出「单文件交互网页」：双击用浏览器打开，同样可点选
 * ========================================================================= */
const MIL = 0.0254;

/* 脚本刚执行时先拍一张静态外壳的快照。
   导出交互网页时用它 —— 导出的页面跟这里同一个模子，
   又不会把运行时生成的列表、序号 chips 一起塞进去。 */
const SHELL = (function () {
  const el = document.getElementById('app');
  return el ? el.outerHTML : '';
})();

const POLAR_ELEC = /CAP-SMD_BD|(?:^|[_-])CP[_-]|(?:^|[_-])(?:RADIAL|ELEC|SMD-?CP)|铝电解/i;
const POLAR_DIODE = /(?:^|[_-])(?:SMA|SMB|SMC)(?:[_-]|$)|(?:^|[_-])SOD-?\d|DO-214|DO-4[01]|DO-201/i;
const POLAR_ARRAY = /RES-?ARRAY|RES-?NET|RA[_-]?\d|排阻/i;

  if (POLAR_TANT.test(fp)) return '钽电容';
  if (POLAR_ELEC.test(fp)) return '电解电容';

/* ---------------------- 视图缩放 / 平移（手机端必需） ---------------------- *
 * 手机上整板视图里一颗 0603 只有几像素，手指点不中，所以必须能放大。
 * k 是相对「适应窗口」的倍数，(dx,dy) 是屏幕像素平移。 */
const VIEW = { k: 1, dx: 0, dy: 0 };
const K_MAX = 10;

/* 把平移限制住，不让板子被拖到画布外面去 */
function clampView(W, H) {
  W = W || (layout ? layout.W : stage.clientWidth);
  H = H || (layout ? layout.H : stage.clientHeight);
  if (VIEW.k <= 1.001) { VIEW.k = 1; VIEW.dx = 0; VIEW.dy = 0; return; }
  const mx = (VIEW.k - 1) * W / 2, my = (VIEW.k - 1) * H / 2;
  VIEW.dx = Math.max(-mx, Math.min(mx, VIEW.dx));
  VIEW.dy = Math.max(-my, Math.min(my, VIEW.dy));
}

/* 以画布内 (ax,ay) 为锚点缩放到 newK —— 锚点下面的那一点保持不动，
   双指捏合时手指夹住的位置不会跑，手感才对 */
function zoomAt(newK, ax, ay) {
  newK = Math.max(1, Math.min(K_MAX, newK));
  const W = stage.clientWidth, H = stage.clientHeight;
  const r = newK / VIEW.k;
  VIEW.dx = (ax - W / 2) * (1 - r) + VIEW.dx * r;
  VIEW.dy = (ay - H / 2) * (1 - r) + VIEW.dy * r;
  VIEW.k = newK;
  clampView(W, H);
}

/* ==================== 手机横屏 / 坐标换算（手机端的地基） ==================== *
 * 焊接的人不会坐在电脑前，手机是立在桌上的，所以：
 *   ① 竖着拿手机 → 整页转 90° 当横屏用（浏览器不让网页锁方向，只能自己转）
 *   ② 一旦转了，屏幕坐标和页面坐标差 90°，所有手指位置都得先换算，
 *      否则点哪都不准 —— 换算只写在 stagePoint / localDelta 两个地方。
 * ========================================================================== */
const appEl = document.getElementById('app');
let ROT = false;                 // 整页是否转了 90°

/* 手指操作（手机 / 平板）—— 只有这类设备才会整页转横屏 */
function isTouch() {
  return !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
}

/* 用手机版布局：手指设备，或者窗口太窄（电脑上把窗口拉窄也按手机排） */
function isMobileLayout() {
  /* Android 外壳（APK）会在 head 里注入 __APP_WRAPPER__。
     不靠 pointer:coarse —— 定制 WebView 上它不一定报 true，报错了就成了桌面版布局。 */
  if (window.__APP_WRAPPER__) return true;
  if (isTouch() || document.documentElement.clientWidth <= 760) return true;
  /* 和 CSS 里那条 max-height: 520px 对齐：横屏手机视口就是 390 高。
     两个判断必须一致，否则会出现「CSS 认为是手机、JS 认为是桌面」的半截样式。 */
  return document.documentElement.clientHeight <= 520;
}

/* 跑在 APK 外壳里吗？原生那边会注入 AndroidBridge。
   只在「选择文件」这一处用得上：外面能弹一个「微信 / QQ 收到的文件」的入口，
   浏览器和 EDA 插件里没有这回事，照旧走 <input type=file>。 */
const IN_APK = (() => {
  try {
    return !!(window.AndroidBridge && AndroidBridge.isShell && AndroidBridge.isShell());
  } catch (_) { return false; }
})();

function applyOrient() {
  const dw = document.documentElement.clientWidth;
  const dh = document.documentElement.clientHeight;
  const want = isTouch() && dh > dw + 24;            // 竖着拿手机
  if (want !== ROT) { ROT = want; VIEW.k = 1; VIEW.dx = 0; VIEW.dy = 0; }
  document.body.classList.toggle('rot', ROT);
  if (ROT) {
    appEl.style.width = dh + 'px';                 // 宽高互换，再顺时针转 90°
    appEl.style.height = dw + 'px';
    appEl.style.transform = 'translateX(' + dw + 'px) rotate(90deg)';
  } else {
    appEl.style.width = '';
    appEl.style.height = '';
    appEl.style.transform = '';
  }
  /* 顺序有讲究：先把信息块搬进抽屉，再量抽屉 —— 不然量到的把手还没有那两行字 */
  placeInfo(ROT || isMobileLayout());
  fitDrawer();
  if (COMPS.length) drawBase();
}

/* 当前分组的信息块在电脑上属于顶栏，在手机上搬到抽屉顶上 ——
   同一个节点搬来搬去，只有一份内容，不会两边说法不一致。 */
function placeInfo(mobile) {
  const tt = document.getElementById('ttBox');
  const slot = document.getElementById('ttSlot');
  const hd = document.querySelector('header');
  if (!tt || !slot || !hd) return;
  if (mobile) {
    if (tt.parentNode !== slot) slot.appendChild(tt);
  } else if (tt.parentNode !== hd) {
    hd.insertBefore(tt, document.querySelector('.acts'));
  }
}

/* 屏幕坐标 → #app 里的坐标（转过就把旋转反算回去） */
function appPoint(cx, cy) {
  const r = appEl.getBoundingClientRect();
  return ROT
    ? { x: cy - r.top, y: r.right - cx }
    : { x: cx - r.left, y: cy - r.top };
}

/* 屏幕坐标 → 画布（#stage）坐标 */
function stagePoint(cx, cy) {
  const p = appPoint(cx, cy);
  let n = stage, ox = 0, oy = 0;
  while (n && n !== appEl) { ox += n.offsetLeft; oy += n.offsetTop; n = n.offsetParent; }
  return { x: p.x - ox, y: p.y - oy };
}

/* 手指在屏幕上划的位移 → 页面里的位移（同样要反算 90°） */
function localDelta(dx, dy) {
  return ROT ? { dx: dy, dy: -dx } : { dx: dx, dy: dy };

async function getEda() {

async function loadFromEda(e) {
  const all = await e.pcb_PrimitiveComponent.getAll();
  const out = [];
  for (const c of all) {
    const fp0 = c.getState_Footprint() || '';
    const x0 = c.getState_X(), y0 = c.getState_Y();
    let ang0 = 0;
    try { ang0 = Number(c.getState_Rotation()) || 0; } catch (_) { }
    ang0 = ((ang0 % 360) + 360) % 360;

    let pins = [];
    try {
      const ps = await e.pcb_PrimitiveComponent.getAllPinsByPrimitiveId(c.getState_PrimitiveId());
      /* 先按封装名推一套焊盘尺寸当模板，再逐个去配 EDA 给的真实数据：
         坐标一律用 EDA 的（准）；尺寸优先用 getState_Pad() 的焊盘外形，
         拿不到（或返回枚举数字）就退回模板 —— 反正不能只有一个中心点。 */
      const tmpl = makePads(fpGeom(fp0), estimateSize(fp0), x0, y0, ang0).pads;
      pins = ps.map((p, i) => {
        let w = 0, h = 0, shp = 'rect';
        try {
          const sp = p.getState_Pad && p.getState_Pad();
          if (sp && sp.length >= 3) {
            const t = String(sp[0] || '').toUpperCase();
            if (t.indexOf('ELLIPSE') >= 0 || t.indexOf('POLYGON') >= 0) {
              w = Number(sp[1]) || 0; h = Number(sp[2]) || w; shp = 'circle';
            } else if (t.indexOf('RECT') >= 0) {
              w = Number(sp[1]) || 0; h = Number(sp[2]) || 0; shp = 'rect';
            }
          }
        } catch (_) { }
        if (!w || !h) {
          const t = tmpl[i] || tmpl[tmpl.length - 1] || null;
          if (t) { w = t[4]; h = t[5]; shp = t[6]; }
        }
        return [p.getState_X(), p.getState_Y(), p.getState_Net(), p.getState_PadNumber(), w, h, shp];
      });
    } catch (_) { }
    const op = c.getState_OtherProperty() || {};
    out.push({
      pid: c.getState_PrimitiveId(),
      d: c.getState_Designator(),
      v: op['Value'] || '',
      fp: fp0,
      layer: c.getState_Layer(),
      x: x0,
      y: y0,
      angle: ang0,
      pins,
      syn: false,          // 焊盘来自 EDA 真实坐标，别用封装名推算覆盖掉
    });
  }
  return out;
}

async function loadBoard(e) {
  try {
    const pls = await e.pcb_PrimitivePolyline.getAll();
    const pl = pls.find(p => p.getState_Layer() === 11);
    if (!pl) return null;
    const poly = (pl.getState_Polygon() || {}).polygon;
    if (!poly || !poly.length) return null;
    if (poly[0] === 'R') return { x: poly[1], y: poly[2], w: poly[3], h: poly[4] };
    const nums = poly.filter(n => typeof n === 'number');
    if (nums.length < 4) return null;
    const xs = [], ys = [];
    for (let i = 0; i + 1 < nums.length; i += 2) { xs.push(nums[i]); ys.push(nums[i + 1]); }
    return { x: Math.min(...xs), y: Math.max(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) };
  } catch (_) { return null; }
}

/* 优先用浏览器原生解压；老浏览器（Chrome<103 / Firefox<113 / Safari<16.4）没有
 * DecompressionStream，就用下面这段纯 JS 的 inflate 兜底 —— 这样把文件拷给谁都能用。 */
async function inflateRaw(bytes) {
  if (typeof DecompressionStream === 'function') {
    try {
      const ds = new DecompressionStream('deflate-raw');
      const st = new Blob([bytes]).stream().pipeThrough(ds);
      return new Uint8Array(await new Response(st).arrayBuffer());
    } catch (_) { /* 不支持 deflate-raw，落到纯 JS */ }
  }
  return inflateRawJS(bytes);
}

/* 纯 JS 的 raw DEFLATE 解码（RFC 1951）。无依赖、无网络。 */
function inflateRawJS(u8) {
