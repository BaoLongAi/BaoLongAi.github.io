.fam>summary{padding:12px 16px;cursor:pointer;list-style:none;display:flex;

.list{padding:2px 16px 14px;display:flex;flex-wrap:wrap;gap:6px}
.item{display:flex;align-items:baseline;gap:6px;border:1px solid var(--line);

.item:hover{border-color:#58a6ff;background:#20304a;text-decoration:none}
.item b{font-family:var(--mono);font-weight:600;font-size:12px}
.item i{font-style:normal;color:var(--dim);font-size:10.5px;font-family:var(--mono)}
footer{color:var(--dim);font-size:11.5px;text-align:center;padding:24px 0;
  line-height:1.9;border-top:1px solid var(--line);margin-top:26px}
code{font-family:var(--mono);background:#21262d;padding:1px 5px;border-radius:4px}

function render(kw){
  const box=document.getElementById('list');
  const q=kw.trim().toLowerCase();
  const hit=ITEMS.filter(x=>!q||x.n.toLowerCase().includes(q)||x.f.toLowerCase().includes(q)||x.p.toLowerCase().includes(q));
  const byFam={};
  hit.forEach(x=>{ (byFam[x.f]=byFam[x.f]||[]).push(x); });
  const fams=Object.keys(byFam).sort();
  box.innerHTML=fams.map(f=>{
    const items=byFam[f].sort((a,b)=>a.n.localeCompare(b.n)).map(x=>
      `<a class="item" href="chips/${x.file}"><b>${x.n}</b><i>${x.p} · ${x.c}脚</i></a>`).join('');
    const open=(q||fams.length<=3)?' open':'';
    return `<details class="fam"${open}><summary>${f||'其他'}<span class="n">${byFam[f].length}</span></summary><div class="list">${items}</div></details>`;
  }).join('');
  document.getElementById('stat').textContent=`匹配 ${hit.length} / ${ITEMS.length} 颗芯片`;
}
document.getElementById('q').addEventListener('input',e=>render(e.target.value));
